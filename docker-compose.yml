services:
  artasia:
    image: ${ARTASIA_IMAGE:-ghcr.io/your-github-owner/artasia-galaxy:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      IMMICH_URL: ${IMMICH_URL:-http://127.0.0.1:2283}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      PORT: 3000
      DATA_DIR: /data
      WORDPRESS_URL: ${WORDPRESS_URL:-https://artsforall.co}
      RECONCILE_SECRET: ${RECONCILE_SECRET}
      RECONCILE_SKIP_BOOT_DRIFT: ${RECONCILE_SKIP_BOOT_DRIFT:-0}
    volumes:
      - ./data:/data
    restart: unless-stopped
