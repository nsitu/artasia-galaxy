name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy Docker Compose file to VM temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker-compose.yml
          target: /tmp/artasia-galaxy-deploy
          overwrite: true

      - name: Install Docker Compose file on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/artasia-galaxy
            sudo mv /tmp/artasia-galaxy-deploy/docker-compose.yml /opt/artasia-galaxy/docker-compose.yml
            sudo rm -rf /tmp/artasia-galaxy-deploy

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/artasia-galaxy
            sudo ARTASIA_IMAGE=${{ env.IMAGE_NAME }}:latest docker compose pull
            sudo ARTASIA_IMAGE=${{ env.IMAGE_NAME }}:latest docker compose up -d --remove-orphans
            sudo docker image prune -f

      - name: Copy WordPress plugin to VM temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: apps/wp-artasia-locations/*
          target: /tmp/wp-artasia-locations-deploy
          strip_components: 2
          overwrite: true

      - name: Install and activate WordPress plugin
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo rm -rf /opt/bitnami/wordpress/plugins/wp-artasia-locations
            sudo cp -r /tmp/wp-artasia-locations-deploy /opt/bitnami/wordpress/plugins/wp-artasia-locations
            sudo chown -R daemon:daemon /opt/bitnami/wordpress/plugins/wp-artasia-locations
            WP_BIN=$(command -v wp || echo /opt/bitnami/wp-cli/bin/wp)
            sudo "$WP_BIN" plugin activate wp-artasia-locations --path=/opt/bitnami/wordpress
            sudo rm -rf /tmp/wp-artasia-locations-deploy

      - name: Delete old GHCR image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          # Increase this later if registry storage allows keeping rollback images.
          min-versions-to-keep: 1
